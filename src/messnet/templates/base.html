<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>messnet{% if current %} · {{ current.title }}{% endif %}</title>
<style>
:root { color-scheme: light dark; --bg:#fafafa; --fg:#1d2024; --dim:#6b7280; --line:#d5d9de; --panel:#fff;
        --accent:#0b6bcb; --sel:#dbeafe; --ok:#15803d; --warn:#a16207; --fail:#b91c1c; --key:#0e7490; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171a; --fg:#e4e6e9; --dim:#9aa1ab; --line:#33383e; --panel:#1b1f23;
        --accent:#6cb2ff; --sel:#1e3a5f; --ok:#4ade80; --warn:#facc15; --fail:#f87171; --key:#22d3ee; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
nav { position:sticky; top:0; z-index:2; display:flex; gap:.25rem; align-items:center; padding:.4rem 1rem;
      background:var(--panel); border-bottom:1px solid var(--line); }
nav .brand { font-weight:700; margin-right:1rem; }
nav a { padding:.25rem .7rem; border-radius:.4rem; color:var(--fg); text-decoration:none; }
nav a:hover { background:var(--sel); }
nav a[aria-current="page"] { background:var(--accent); color:var(--bg); }
nav .node { margin-left:auto; color:var(--dim); }
main { padding:1rem; }
a { color:var(--accent); }
.dim { color:var(--dim); } .ok { color:var(--ok); } .warn { color:var(--warn); } .fail { color:var(--fail); font-weight:600; }
.key { color:var(--key); }
section.box { background:var(--panel); border:1px solid var(--line); border-radius:.5rem; padding:.5rem .75rem; margin-bottom:1rem;
              overflow-x:auto; }
section.box > h2 { margin:0 0 .4rem; font-size:.8rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); }
table { border-collapse:collapse; width:100%; }
th, td { text-align:left; padding:.2rem .6rem .2rem 0; vertical-align:top; }
th a { color:var(--dim); text-decoration:none; white-space:nowrap; }
th a:hover { color:var(--fg); }
tr.sel td { background:var(--sel); }
tbody tr:hover td { background:color-mix(in srgb, var(--sel) 50%, transparent); }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
table.linked td { padding:0; }
table.linked td > a { color:inherit; text-decoration:none; display:block; padding:.2rem .6rem .2rem 0; }
.scroll { max-height:32vh; overflow:auto; }
.scroll thead { position:sticky; top:0; z-index:1; background:var(--panel); }
.filter input[type=text], .filter select { font:inherit; padding:.15rem .3rem; border:1px solid var(--line); border-radius:.3rem;
        background:var(--bg); color:var(--fg); width:100%; min-width:4rem; }
.bar { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-bottom:.4rem; }
.bar input[type=text] { width:14rem; }
.filter .bar select { width:auto; min-width:0; }
.bar .grow { flex:1; }
button { font:inherit; padding:.15rem .7rem; border:1px solid var(--line); border-radius:.3rem; background:var(--bg); color:var(--fg); cursor:pointer; }
.error { color:var(--fail); }
.layout { display:grid; grid-template-columns:minmax(18rem, 26rem) 1fr; gap:1rem; align-items:start; }
@media (max-width: 60rem) { .layout { grid-template-columns:1fr; } }
dl.lines { display:grid; grid-template-columns:max-content 1fr; gap:.1rem 1rem; margin:0 0 .6rem; }
dl.lines dt { color:var(--dim); } dl.lines dd { margin:0; overflow-wrap:anywhere; }
h3 { margin:.6rem 0 .2rem; font-size:.95rem; color:var(--key); }
#latest { position:sticky; bottom:0; z-index:2; margin:0; border-radius:0; border-width:1px 0 0; }
#latest .head { display:flex; gap:.75rem; flex-wrap:wrap; }
</style>
</head>
<body data-version="{{ version }}" data-fallback="{{ fallback }}">
<nav aria-label="Pages">
  <span class="brand">messnet</span>
  {% for p in pages %}<a href="{{ p.path }}"{% if current and p.path == current.path %} aria-current="page"{% endif %}>{{ p.title }}</a>{% endfor %}
  {% if node %}<span class="node">{{ node }}</span>{% endif %}
</nav>
<main id="content">
{% block content %}{% endblock %}
</main>
{% if current and current.latest %}
<section class="box" id="latest" aria-label="Latest event">
{% include "_latest.html" %}
</section>
{% endif %}
<script>
// The page holds /_changes open; the server sends the current version when it moves.  A version other
// than the one this page was drawn at means: fetch this page again and swap in the content and the
// latest panel (the URL holds every selection, so nothing is lost).  Also fetch after a long silence,
// and when the tab comes back; a hidden tab holds no connection.  Ages are kept current here, from
// the timestamps, so they need no traffic.
(function () {
  const body = document.body;
  let version = body.dataset.version, source = null, fallback = null, pending = false;
  const fallbackMs = Number(body.dataset.fallback) * 1000;

  const busy = () => { const a = document.activeElement; return a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); };

  function ago(ms) {
    let s = Math.floor(ms / 1000);
    if (s < -1) return "in the future";
    s = Math.max(0, s);
    if (s < 60) return s + "s ago";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }
  let ticker = null;
  function tick() {
    clearTimeout(ticker);
    let youngest = Infinity;
    for (const el of document.querySelectorAll("time.age")) {
      const ms = Date.now() - Date.parse(el.getAttribute("datetime"));
      if (!isNaN(ms)) { youngest = Math.min(youngest, ms); el.textContent = ago(ms); }
    }
    if (!document.hidden) ticker = setTimeout(tick, youngest < 3600000 ? 5000 : 60000);
  }

  function restartFallback() {
    clearTimeout(fallback);
    fallback = setTimeout(refresh, fallbackMs);
  }

  // Scrolling lists keep their place across a swap while they still list the same thing; otherwise
  // (another host selected, the page just opened) the selected row is brought into view.
  function scrollPlaces() {
    return new Map([...document.querySelectorAll(".scroll")].map((box) => [box.dataset.scroll, box.scrollTop]));
  }
  function settle(places) {
    for (const box of document.querySelectorAll(".scroll")) {
      if (places && places.has(box.dataset.scroll)) { box.scrollTop = places.get(box.dataset.scroll); continue; }
      const row = box.querySelector("tr.sel"), head = box.querySelector("thead");
      if (!row) continue;
      const b = box.getBoundingClientRect(), r = row.getBoundingClientRect(), top = b.top + (head ? head.offsetHeight : 0);
      if (r.top < top) box.scrollTop -= top - r.top;
      else if (r.bottom > b.bottom) box.scrollTop += r.bottom - b.bottom;
    }
  }

  async function refresh(now) {
    restartFallback();
    if (!now && busy()) { pending = true; return; }       // not while the user is typing; again when they stop
    pending = false;
    try {
      const r = await fetch(location.href, { headers: { "X-Requested-With": "fetch" } });
      if (!r.ok) return;
      const doc = new DOMParser().parseFromString(await r.text(), "text/html");
      const places = scrollPlaces();
      for (const id of ["content", "latest"]) {
        const fresh = doc.getElementById(id), old = document.getElementById(id);
        if (fresh && old && fresh.innerHTML !== old.innerHTML) old.innerHTML = fresh.innerHTML;
      }
      settle(places);
      version = doc.body.dataset.version;
      tick();
    } catch (e) { if (now) location.reload(); /* else: the server is away; the stream says if anything changed */ }
  }
  // Choosing a row swaps the page in place (the URL still changes, so back works) and leaves the lists where they were.
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest("table.linked td > a");
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    history.pushState(null, "", a.href);
    refresh(true);
  });
  window.addEventListener("popstate", () => refresh(true));
  document.addEventListener("focusout", () => setTimeout(() => { if (pending && !busy()) refresh(); }, 0));

  function connect() {
    if (source || !window.EventSource) return;
    source = new EventSource("/_changes");
    source.onmessage = (e) => { if (e.data !== version) refresh(); else restartFallback(); };
  }
  function disconnect() {
    if (source) { source.close(); source = null; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { disconnect(); clearTimeout(fallback); clearTimeout(ticker); }
    else { refresh(); connect(); tick(); }
  });

  settle(null);
  if (fallbackMs > 0) restartFallback();
  if (!document.hidden) connect();
  tick();
})();
</script>
</body>
</html>
