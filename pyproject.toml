[project]
name = "messnet"
version = "0.1.0"
description = "Multi-host event notification network: CloudEvents JSONL spool replicated over pluggable links"
readme = {file = "README.org", content-type = "text/org"}
authors = [
    { name = "Brett Viren", email = "brett.viren@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "cryptography>=50.0.2",
]

[project.scripts]
messnet = "messnet:main"

[project.optional-dependencies]
iroh = [
    "iroh>=1.1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
